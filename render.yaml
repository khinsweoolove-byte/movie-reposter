services:
  - type: web
    name: movie-reposter
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python web.py
    healthCheckPath: /health
    envVars:
      - key: USER_SESSION
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: TMDB_API_KEY
        sync: false
      - key: HOURLY
        value: "1"
      - key: POSTS_PER_HOUR
        value: "5"
      - key: INTERVAL_SECONDS
        value: "720"
      - key: DAILY_LIMIT
        value: "0"
      - key: NOTIFY_CHAT
        value: me
